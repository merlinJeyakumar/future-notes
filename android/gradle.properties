org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's relative-path incremental cache fails when the project and Pub cache
# are on different Windows drives. A deterministic full Kotlin compile avoids
# daemon failures/fallbacks without affecting runtime performance or shrinking.
kotlin.incremental=false
